# Starts the local Jenkins for this project. One-time, per machine, record
# the Docker socket's group number (needs the image built once first):
#   echo "DOCKER_GID=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
#     --entrypoint stat vuln-scanner-jenkins:local -c %g /var/run/docker.sock)" > ci/jenkins/.env
# Then:
#   docker compose -f ci/jenkins/docker-compose.yml up -d --build
# Then open http://localhost:8080
#
# LOCAL LAB USE ONLY.
# Mounting the Docker socket lets Jenkins build and scan images, but it
# also gives Jenkins full control of Docker on this machine (equivalent to
# admin rights). That's acceptable for a personal lab; a production Jenkins
# would use a dedicated build agent or a rootless builder instead.
services:
  jenkins:
    build: .
    image: vuln-scanner-jenkins:local
    container_name: vuln-scanner-jenkins
    ports:
      # Bound to localhost only: not reachable from other machines.
      - "127.0.0.1:8080:8080"
    volumes:
      # Jobs, credentials, build history and the Trivy DB cache survive restarts.
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    # Lets the (non-root) jenkins user use the Docker socket by joining the
    # socket's group. The group number differs between machines, so it is
    # read from DOCKER_GID in ci/jenkins/.env (machine-specific, not
    # committed). Compose stops with this message if it isn't set.
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in ci/jenkins/.env (see top of this file)}"
    restart: unless-stopped

volumes:
  jenkins_home:
