name: Container Image Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Rescans (Sprint 5). New CVEs are published every day against images
  # whose code has not changed, so a scan only on push goes stale.
  #   schedule:          daily 02:30 UTC = 08:00 IST, an hour before the
  #                      Monday weekly digest, so the digest sees it.
  #   workflow_dispatch: "Run workflow" button for an on-demand rescan,
  #                      e.g. right after an upstream fix is released.
  # Each rescan REBUILDS the image, so patched base-image layers are
  # picked up too, then applies the same policy, exceptions and alerts.
  # A rescan that finds a new blocking CVE fails and alerts Slack exactly
  # like a push would. Scheduled runs only ever run on main.
  schedule:
    - cron: "30 2 * * *"
  # Sprint 6: optional inputs mirror Jenkins' "Build with Parameters", so the
  # same test matrix can run on both CI systems. Empty scan_image = build and
  # scan the repo's own image, as push / PR / schedule runs always do.
  workflow_dispatch:
    inputs:
      scan_image:
        description: "Image to scan instead of the repo image (e.g. python:3.9-slim). Leave empty for the repo image."
        required: false
        default: ""
      policy_file:
        description: "Policy file to apply (e.g. tests/demo-policy-exceptions-pass.yaml)"
        required: false
        default: "policy.yaml"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      # Pango is the text-layout library WeasyPrint needs to draw the PDF.
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Sprint 6: the unit tests run before anything is scanned, so a broken
      # change fails fast and the required `scan` check covers them too.
      - name: Run unit tests
        run: python -m unittest discover -s tests

      # Sprint 6: decide what to scan. Inputs only exist on manual runs; on
      # push / PR / schedule both are empty, so the repo image and
      # policy.yaml are used. Inputs arrive through env (never pasted into
      # the script) and are checked before use: an image name may only hold
      # image-reference characters, and the policy must be a file in the repo.
      - name: Resolve scan target
        id: target
        env:
          SCAN_IMAGE: ${{ inputs.scan_image }}
          POLICY_FILE: ${{ inputs.policy_file }}
        run: |
          image="${SCAN_IMAGE:-}"
          policy="${POLICY_FILE:-policy.yaml}"
          if [ -n "$image" ] && ! [[ "$image" =~ ^[A-Za-z0-9][A-Za-z0-9._/:@-]*$ ]]; then
            echo "::error::scan_image contains characters not allowed in an image name."; exit 2
          fi
          if [[ "$policy" == /* || "$policy" == *..* ]] || [ ! -f "$policy" ]; then
            echo "::error::policy_file must be a file in this repository."; exit 2
          fi
          if [ -n "$image" ]; then build=false; else image=vuln-scanner-test:ci; build=true; fi
          { echo "image=$image"; echo "policy=$policy"; echo "build=$build"; } >> "$GITHUB_OUTPUT"
          echo "Image to scan: $image"
          echo "Policy file:   $policy"

      - name: Cache Trivy database
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      # Pinned to the version tested locally, so CI doesn't change
      # behaviour on its own when Trivy releases. Bump deliberately.
      # Retry (Sprint 5): the install downloads from GitHub on every run,
      # the likeliest place for a network blip. Up to 3 tries, then fail.
      # pipefail: GitHub runs this with plain `bash -e`, which only checks
      # the LAST command of a pipe. Without it, a failed curl would feed
      # `sh` an empty script that "succeeds", and the retry would not run.
      - name: Install Trivy
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if curl -sfL --retry 3 https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                 | sudo sh -s -- -b /usr/local/bin v0.76.0; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Trivy install failed after 3 attempts."; exit 1
            fi
            echo "::warning::Trivy install attempt $attempt failed; retrying in 15s."
            sleep 15
          done
          trivy --version

      # Retry (Sprint 5): pulling the base image from Docker Hub can fail
      # briefly. A real Dockerfile error fails all 3 tries, as it should.
      - name: Build image
        if: steps.target.outputs.build == 'true'
        run: |
          for attempt in 1 2 3; do
            if docker build -t vuln-scanner-test:ci sample-app; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Image build failed after 3 attempts."; exit 1
            fi
            echo "::warning::Image build attempt $attempt failed; retrying in 15s."
            sleep 15
          done

      # The gate — and now the ONLY scan. scanner.py retries Trivy itself
      # (3 attempts, Sprint 5), so this step has no retry of its own. scanner.py writes Trivy's raw
      # JSON (trivy-report.json) and its own verdict (scan-summary.json)
      # into reports/, from the same scan it judges.
      # Exit 1 (policy fail) or 2 (tool error) fails the build.
      - name: Run vulnerability scan
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          POLICY: ${{ steps.target.outputs.policy }}
        run: python src/scanner.py "$IMAGE" --policy "$POLICY" --output-dir reports

      # Turn the two JSON files into reports/report.html and report.pdf. `if: always()`
      # so a FAIL or ERROR still gets a readable report. It only reads the
      # verdict from scan-summary.json; it never re-decides pass/fail.
      - name: Generate HTML and PDF report
        if: always()
        run: python src/report.py --input-dir reports --pdf

      # Alert Slack only when something needs attention. `if: failure()`
      # runs this step only if an earlier step failed: a policy block
      # (exit 1), a tool error (exit 2), or the pipeline breaking before
      # the scan. A passing run stays silent. The webhook URL comes from
      # the repository secret and is never written into the repo or logs.
      - name: Send Slack alert
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          POLICY: ${{ steps.target.outputs.policy }}
        run: python src/notify.py --input-dir reports --policy "${POLICY:-policy.yaml}"

      # `if: always()` uploads even when the gate fails — that's when the
      # report matters most. On a tool error only scan-summary.json may
      # exist, so a missing file is a warning, not a second failure.
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-scan-report
          path: reports/
          if-no-files-found: warn
