# Policy gate thresholds for the container vulnerability scanner.
#
# The build FAILS if the count of vulnerabilities at a given severity
# EXCEEDS the limit below. "Exceeds" means strictly greater than:
# with HIGH: 10, a scan finding exactly 10 HIGHs still PASSES; 11 FAILS.
#
# CRITICAL is 0 — zero tolerance. One critical blocks the build.

thresholds:
  CRITICAL: 0
  HIGH: 10

# Slack alerts: severities that make the alert @channel (everyone notified).
# Allowed: CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN, ERROR.
alerts:
  mention_channel_on: [CRITICAL]

# Exceptions: approved known vulnerabilities (Sprint 5).
#
# A listed CVE is still REPORTED (it is still in the image) but does not
# count towards the thresholds above, until it expires. Use this instead
# of raising a threshold, which would let EVERY new HIGH through too.
#
# Required: id, reason, approved_by, approved_on, expires
# Optional: package  - only this package (default: any package)
#           image    - only this image; without a tag it means any tag,
#                      e.g. vuln-scanner-test (default: every image)
# Rules:    expires may be at most 90 days after approved_on.
#           Expired -> no longer applied; the CVE blocks again.
#           Any mistake (missing field, bad date, typo in a field name)
#           stops the pipeline as a tool error, never a silent pass.
# Add or change exceptions through a PR: the Git history is the record of
# who approved what, and why.
#
# Example:
#   exceptions:
#     - id: CVE-2026-12345
#       package: openssl
#       image: vuln-scanner-test
#       reason: No upstream fix yet; the affected function is not used
#       approved_by: Kamal Vasvani
#       approved_on: 2026-10-22
#       expires: 2026-12-31
exceptions: []
