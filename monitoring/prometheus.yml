# Prometheus for the vulnerability dashboard (Sprint 4).
# The exporter fetches new scans every 5 minutes; scraping every minute
# keeps the dashboard at most a minute behind the exporter.
global:
  scrape_interval: 1m
  evaluation_interval: 1m

scrape_configs:
  - job_name: vuln-exporter
    static_configs:
      - targets: ["exporter:9105"]
